name: Nightly Release
on:
  workflow_dispatch:

jobs:
  nightly-release:
    name: Nightly Release
    uses: $/.github/workflows/reusable-release.yaml
    with:
      nightly: true
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write
